services:
  - type: web
    name: nritya-ai-backend
    env: python
    region: oregon
    plan: free
    branch: feature-hastha
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ENABLE_AI
        value: "false"
      - key: ENVIRONMENT
        value: "production"
      - key: SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: "https://*.vercel.app,http://localhost:3000,http://127.0.0.1:3000"
